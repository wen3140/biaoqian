.node-config input[type=text]:focus,.node-config select:focus,.node-config textarea:focus{border-color:#3989fa;outline:0}
.node-config input:disabled,.node-config select:disabled,.node-config textarea:disabled{background:#f5f7fa;color:#a8abb2;cursor:not-allowed;border-color:#e4e7ed}
.node-config textarea{min-height:92px;resize:vertical;line-height:1.6}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.section-title{margin:6px 0 18px;padding-top:16px;border-top:1px dashed #ebeef5;font-size:12px;color:#909399;letter-spacing:.3px}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;color:#606266;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{width:40px;height:20px;border-radius:10px;background:#dcdfe6;position:relative;transition:background .2s;flex-shrink:0}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:left .2s}
.switch input:checked+.track{background:#3989fa}
.switch input:checked+.track::after{left:22px}
.switch input:disabled+.track{opacity:.55}
.switch input:disabled~.switch-text{color:#b8bec6}
.form-foot{position:sticky;bottom:0;background:#fff;border-top:1px solid #ebeef5;padding:14px 0 16px;display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.form-foot button{min-width:88px}
/* ===== 导出弹窗补充 ===== */
.fmt-row{display:flex;align-items:center;gap:18px;margin-top:16px;font-size:13px;color:#606266}
.fmt-row>span:first-child{color:#909399}
.fmt-row label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.preview-wrap{margin-top:14px;border:1px solid #ebeef5;border-radius:4px;overflow:auto;max-height:230px}
table.preview{border-collapse:collapse;font-size:11.5px;width:100%;min-width:800px}

table.preview td{padding:6px 7px;border:1px solid #e6eaf0;color:#606266;vertical-align:top;line-height:1.45;word-break:break-word}
table.preview tr:nth-child(even) td{background:#fafbfd}
.preview-empty{padding:16px;font-size:12px;color:#b8bec6}

const roots=[
{zh:'类型',en:'Genre',groups:[
G('类型','Genre Type','Type','P0',`

G('元素/母题','Element','Element','P1',`

const nodes=new Map();let leaves=[];
function index(){nodes.clear();leaves=[];roots.forEach((r,ri)=>{r.id='r'+ri;r.level=1;r.root=r;r.enabled=r.enabled!==false;nodes.set(r.id,r);(r.groups||[]).forEach((g,gi)=>{g.id=r.id+'g'+gi;g.level=2;g.root=r;g.enabled=g.enabled!==false;nodes.set(g.id,g);g.items.forEach((t,ti)=>{t.id=g.id+'t'+ti;t.level=3;t.root=r;t.group=g;t.enabled=t.enabled!==false;nodes.set(t.id,t);leaves.push(t);});});});}
const $=id=>document.getElementById(id),esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
index();
const kids=n=>n.groups||n.items||[];
const ids=n=>kids(n).length?kids(n).flatMap(ids):(n.enabled===false?[]:[n.id]);
const label=n=>`${esc(n.zh)} <span class="en">/ ${esc(n.en)}</span>`;
const treeHost=$('tree-host');let selected=null,editing=false,creating=false;const opened=new Set(['r0','r0g0']),chosen=new Set();
function matches(n,key){return (n.zh+' '+n.en).toLowerCase().includes(key);}
function tree(){const key=$('search').value.trim().toLowerCase();function draw(n,parentMatch=false){const hit=parentMatch||matches(n,key);const children=kids(n);if(!children.length)return hit?`<button class="tree-entry${selected===n.id?' selected':''}" data-node="${n.id}"><span class="icon">♧ ♢</span><span>${esc(n.zh)}</span><span class="enabled${n.enabled===false?' off':''}">${n.enabled===false?'停用':'启用'}</span><span class="en">/ ${esc(n.en)}</span></button>`:'';const inner=children.map(c=>draw(c,hit)).join('');if(!inner)return '';return `<details data-folder="${n.id}" ${key||opened.has(n.id)?'open':''}><summary><span class="folder-name" data-node="${n.id}">▱ ${label(n)}${n.enabled===false?' <span class="enabled off">停用</span>':''}</span></summary><div class="hierarchy-branch">${inner}</div></details>`;}treeHost.innerHTML=roots.map(r=>draw(r)).join('')||'<div class="hint">暂无匹配标签</div>';treeHost.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{if(!$('search').value.trim()){d.open?opened.add(d.dataset.folder):opened.delete(d.dataset.folder);}}));}

/* ===== 节点配置：字段定义对齐「节点配置」界面 ===== */
const LEVEL={1:'一级字典值',2:'二级字典值',3:'三级字典值'};
const parentOf=n=>n.level===1?null:n.level===2?n.root:n.group;
const parentText=n=>{if(!n)return '—';const p=n.level===2?n.root:n.group;if(!p)return '—';return p.zh;};
const parentFull=n=>{if(!n)return '';const p=n.level===2?n.root:n.group;if(!p)return '';return `${p.zh} / ${p.en}`;};
function field(id,labelText,value,opts={}){const req=opts.req?'<i>*</i>':'';const ph=opts.ph||'';let ctl;
if(opts.type==='textarea')ctl=`<textarea id="${id}" ${opts.disabled?'disabled':''} placeholder="${esc(ph)}">${esc(value)}</textarea>`;
else if(opts.type==='select')ctl=`<select id="${id}" ${opts.disabled?'disabled':''}>${opts.options.map(([v,t])=>`<option value="${esc(v)}"${v===value?' selected':''}>${esc(t)}</option>`).join('')}</select>`;
else ctl=`<input id="${id}" type="text" ${opts.disabled?'disabled':''} placeholder="${esc(ph)}" value="${esc(value)}">`;
return `<div class="fitem ${opts.cls||''}"${opts.title?` title="${esc(opts.title)}"`:''}><label class="flabel" for="${id}">${req}${labelText}</label>${ctl}</div>`;}
function detailHTML(n){
  if(creating)return `<div class="node-config" id="node-config">
    <div class="section-title">新建一级维度</div>
    ${field('f-zh','节点名称（中文）','', {req:1,ph:'请输入节点名称'})}
    ${field('f-en','节点名称（英文）','', {req:1,ph:'Please enter node name'})}
    ${field('f-level','节点层级','一级字典值',{disabled:1})}
    ${field('f-parent','归属父节点','—',{disabled:1})}
    <div class="fitem"><label class="flabel">启用状态</label><label class="switch"><input type="checkbox" id="f-enabled" checked><span class="track"></span><span class="switch-text">启用</span></label></div>
    <div class="form-foot"><button type="button" id="cancel-btn">取消</button><button type="button" class="primary" id="save-btn">保存</button></div>
  </div>`;
  const leaf=n.level===3;
  const dis=!editing?'disabled':'';
  return `<div class="node-config" id="node-config">
    ${field('f-zh','节点名称（中文）',n.zh,{req:1,disabled:!editing,ph:'请输入节点名称'})}
    ${field('f-en','节点名称（英文）',n.en,{req:1,disabled:!editing,ph:'Please enter node name'})}
    ${field('f-level','节点层级',LEVEL[n.level],{disabled:1})}
    ${field('f-parent','归属父节点',parentText(n),{req:1,disabled:1,type:'select',options:[[parentText(n),parentText(n)]],title:parentFull(n)})}
    <div class="fitem"><label class="flabel">启用状态</label><label class="switch"><input type="checkbox" id="f-enabled" ${n.enabled!==false?'checked':''} ${dis}><span class="track"></span><span class="switch-text">${n.enabled!==false?'启用':'停用'}</span></label></div>
    ${leaf?field('f-def-zh','标签释义',n.defZh||'',{type:'textarea',disabled:!editing,ph:'用于内部运营团队统一该标签的定义标准（选填）'}):
           `<div class="fitem"><label class="flabel">标签释义</label><textarea disabled placeholder="一级 / 二级节点用于分组，标签释义在三级标签上维护">该节点为分组节点，含 ${kids(n).length} 个下级节点</textarea></div>`}
    ${leaf?`<div class="section-title">导出字段（生成「标准标签」导出表时使用）</div>
    ${field('f-def-en','定义（英文）Definition',n.defEn||'',{type:'textarea',disabled:!editing,ph:'English definition aligned with 定义(EN) column'})}
    ${field('f-ex','示例作品 Examples',n.ex||'',{disabled:!editing,ph:'如：The Lord of the Rings, Narnia'})}
    <div class="fgrid2">
      ${field('f-pri','优先级 Priority',n.pri||(n.group&&n.group.pri)||'P1',{type:'select',disabled:!editing,options:[['P0','P0'],['P1','P1'],['P2','P2']]})}
      ${field('f-note','版本标记 Version Note',n.note||'',{disabled:!editing,ph:'如：v1.2 新增'})}
    </div>`:''}
    <div class="form-foot"><button type="button" id="cancel-btn" ${editing?'':'disabled'}>取消</button><button type="button" class="primary" id="save-btn" ${editing?'':'disabled'}>保存</button></div>
  </div>`;
}
function bindDetail(){
  const en=$('f-enabled');if(en)en.onchange=()=>{const t=document.querySelector('.switch-text');if(t)t.textContent=en.checked?'启用':'停用';};
  const c=$('cancel-btn'),s=$('save-btn');
  if(c)c.onclick=()=>{if(creating){creating=false;if(selected)showNode(selected);else emptyDetail();}else{editing=false;showNode(selected);} };
  if(s)s.onclick=save;
}
function emptyDetail(){$('detail').className='detail';$('detail').innerHTML='<div class="empty"><div class="empty-icon">▱</div>请在左侧选中一个节点或点击新建</div>';$('edit-btn').disabled=true;selected=null;}
function showNode(id){selected=id;const n=nodes.get(id);if(!n)return;editing=false;creating=false;$('detail').className='detail has-node';$('detail').innerHTML=detailHTML(n);bindDetail();$('edit-btn').disabled=false;
treeHost.querySelectorAll('.tree-entry').forEach(el=>el.classList.toggle('selected',el.dataset.node===id));}
function save(){
  const zh=$('f-zh').value.trim(),en=$('f-en').value.trim();
  if(!zh||!en){toast('请填写节点名称（中文）和节点名称（英文）');return;}
  if(creating){roots.push({zh,en,groups:[],enabled:$('f-enabled').checked});index();creating=false;selected=null;tree();emptyDetail();toast('已新建一级维度：'+zh);return;}
  const n=nodes.get(selected);n.zh=zh;n.en=en;n.enabled=$('f-enabled').checked;
  if(n.level===3){n.defZh=$('f-def-zh').value.trim();n.defEn=$('f-def-en').value.trim();n.ex=$('f-ex').value.trim();n.pri=$('f-pri').value;n.note=$('f-note').value.trim();}
  editing=false;tree();showNode(selected);toast('节点配置已保存');
}
$('edit-btn').onclick=()=>{if(!selected)return;editing=true;$('detail').innerHTML=detailHTML(nodes.get(selected));bindDetail();};
$('create').onclick=()=>{creating=true;selected=null;editing=true;$('edit-btn').disabled=true;$('detail').className='detail has-node';$('detail').innerHTML=detailHTML(null);bindDetail();treeHost.querySelectorAll('.tree-entry').forEach(el=>el.classList.remove('selected'));};
treeHost.addEventListener('click',e=>{const n=e.target.closest('[data-node]');if(n)showNode(n.dataset.node);});$('search').oninput=tree;

const HEADER=['维度 Dimension','子类 Subcategory','标签(EN) Tag','标签(CN) 中文','定义(EN) Definition','定义(CN) 中文定义','示例作品 Examples','优先级 Priority','版本标记 Version Note'];
function rowOf(t){const g=t.group,r=t.root;return [`${r.en} ${r.zh}`,`${g.code||g.en} ${g.zh}`,t.en,t.zh,t.defEn||'',t.defZh||'',t.ex||'',t.pri||g.pri||'P1',t.note||''];}
const dialog=$('export-dialog');
function choiceMarkup(n){const children=kids(n);const off=n.enabled===false;const check=`<label class="${off?'off':''}"><input type="checkbox" data-choice="${n.id}" ${off?'disabled':''}><span>${label(n)}</span></label>`;return children.length?`<details ${n.level<3?'open':''}><summary>${check}<small>${ids(n).length} 项</small></summary><div class="export-branch">${children.map(choiceMarkup).join('')}</div></details>`:`<div class="export-leaf">${check}</div>`;}
$('choices').innerHTML=roots.map(choiceMarkup).join('')||'<div class="hint">暂无可导出的标签</div>';
const exportable=()=>leaves.filter(t=>t.enabled!==false);
function renderPreview(){
  const rows=leaves.filter(t=>chosen.has(t.id)).slice(0,3).map(rowOf);
  const host=$('preview-wrap');
  if(!rows.length){host.innerHTML='<div class="preview-empty">勾选标签后可预览导出表的前 3 行内容</div>';return;}
  host.innerHTML=`<table class="preview"><thead><tr>${HEADER.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)||'<span style="color:#d0d4da">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function sync(){const total=exportable().length,count=chosen.size;
  $('count').textContent=`已选 ${count} / ${total} 个标签`;
  $('select-all').checked=total>0&&count===total;$('select-all').indeterminate=count>0&&count<total;
  $('download').disabled=!count;$('download').textContent=count?`导出所选标签（${count}）`:'导出所选标签';
  $('choices').querySelectorAll('[data-choice]').forEach(box=>{const list=ids(nodes.get(box.dataset.choice)),n=list.filter(id=>chosen.has(id)).length;box.checked=list.length>0&&n===list.length;box.indeterminate=n>0&&n<list.length;});
  renderPreview();}
$('choices').addEventListener('click',e=>{if(e.target.closest('label'))e.stopPropagation();});
$('choices').onchange=e=>{if(!e.target.matches('[data-choice]'))return;ids(nodes.get(e.target.dataset.choice)).forEach(id=>e.target.checked?chosen.add(id):chosen.delete(id));sync();};
$('select-all').onchange=e=>{chosen.clear();if(e.target.checked)exportable().forEach(t=>chosen.add(t.id));sync();};
$('export').onclick=()=>{if(!chosen.size&&selected)ids(nodes.get(selected)).forEach(id=>chosen.add(id));sync();dialog.showModal();};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>dialog.close());
let timer;function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,4000);}

/* ===== XLSX WRITER START (纯函数，无 DOM 依赖) ===== */
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(buf){let c=0xFFFFFFFF;for(let i=0;i<buf.length;i++)c=CRC_TABLE[(c^buf[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let offset=0;
  const now=new Date();
  const dosTime=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1))&0xFFFF;
  const dosDate=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xFFFF;
  files.forEach(f=>{
    const name=enc.encode(f.name);
    const data=typeof f.data==='string'?enc.encode(f.data):f.data;
    const crc=crc32(data);
    const lh=new Uint8Array(30+name.length),lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0x0800,true);lv.setUint16(8,0,true);
    lv.setUint16(10,dosTime,true);lv.setUint16(12,dosDate,true);lv.setUint32(14,crc,true);
    lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);lv.setUint16(26,name.length,true);lv.setUint16(28,0,true);
    lh.set(name,30);parts.push(lh,data);
    const cd=new Uint8Array(46+name.length),cv=new DataView(cd.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);cv.setUint16(10,0,true);
    cv.setUint16(12,dosTime,true);cv.setUint16(14,dosDate,true);cv.setUint32(16,crc,true);
    cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);
    cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,offset,true);
    cd.set(name,46);central.push(cd);offset+=lh.length+data.length;
  });
  const cdSize=central.reduce((a,b)=>a+b.length,0);
  const eocd=new Uint8Array(22),ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,offset,true);ev.setUint16(20,0,true);
  const all=parts.concat(central,[eocd]);
  const total=all.reduce((a,b)=>a+b.length,0),out=new Uint8Array(total);let p=0;
  all.forEach(a=>{out.set(a,p);p+=a.length;});
  return out;
}
function xmlEsc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');}
function colName(i){let s='';i+=1;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
function buildXlsx(header,rows){
  const widths=[16,20,26,18,50,40,38,10,20];
  const cols=widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
  const head=`<row r="1" ht="26" customHeight="1">${header.map((h,i)=>`<c r="${colName(i)}1" s="1" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(h)}</t></is></c>`).join('')}</row>`;
  const body=rows.map((r,ri)=>{const n=ri+2;return `<row r="${n}">`+header.map((_,ci)=>{const v=r[ci]==null?'':r[ci];const st=ci===7?3:2;return `<c r="${colName(ci)}${n}" s="${st}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;}).join('')+'</row>';}).join('');
  const last=rows.length+1;
  const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView tabSelected="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="17"/><cols>${cols}</cols><sheetData>${head}${body}</sheetData><autoFilter ref="A1:${colName(header.length-1)}${last}"/></worksheet>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="3"><font><sz val="10"/><name val="Arial"/></font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Arial"/></font><font><sz val="10"/><color rgb="FF333333"/><name val="Arial"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF4F81BD"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFD9D9D9"/></left><right style="thin"><color rgb="FFD9D9D9"/></right><top style="thin"><color rgb="FFD9D9D9"/></top><bottom style="thin"><color rgb="FFD9D9D9"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="2" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="2" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="top"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const workbook=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="标签导出" sheetId="1" r:id="rId1"/></sheets></workbook>`;
  const wbRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const types=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
  return zipStore([
    {name:'[Content_Types].xml',data:types},
    {name:'_rels/.rels',data:rels},
    {name:'xl/workbook.xml',data:workbook},
    {name:'xl/_rels/workbook.xml.rels',data:wbRels},
    {name:'xl/worksheets/sheet1.xml',data:sheet},
    {name:'xl/styles.xml',data:styles}
  ]);
}
/* ===== XLSX WRITER END ===== */

function makeCSV(rows){return '\uFEFF'+[HEADER,...rows].map(row=>row.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('download').onclick=()=>{
  if(!chosen.size)return;
  const list=leaves.filter(t=>chosen.has(t.id)),rows=list.map(rowOf);
  const fmt=document.querySelector('input[name=fmt]:checked').value;
  const day=new Date().toISOString().slice(0,10);
  if(fmt==='xlsx'){
    const bytes=buildXlsx(HEADER,rows);
    download(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`标准标签_${day}.xlsx`);
  }else{
    download(new Blob([makeCSV(rows)],{type:'text/csv;charset=utf-8;'}),`标准标签_${day}.csv`);
  }
  dialog.close();toast(`已导出 ${rows.length} 个标签`);
};
tree();sync();
})();
